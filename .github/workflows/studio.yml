name: Pliego focused hosted studio checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    if: github.repository == 'alvarovillalbaa/pliego' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pliego-studio-20261114-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact public runtime and native browser journeys
        env:
          PLIEGO_OUTPUT: ${{ runner.temp }}/pliego-studio-originals
          PLIEGO_BASE_URL: https://pliego-zeta.vercel.app
          PLIEGO_CASES: B01,B02,B03,B04
        run: python3 tests/scripts/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pliego-studio-originals
          path: ${{ runner.temp }}/pliego-studio-originals
          if-no-files-found: error
          retention-days: 14
